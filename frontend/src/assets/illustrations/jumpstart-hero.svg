<svg width="1600" height="420" viewBox="0 0 1600 420"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1600" y2="420">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="42%" stop-color="#2B2116"/>
      <stop offset="72%" stop-color="#B66F08"/>
      <stop offset="100%" stop-color="#F5C518"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#FFF3A0" stop-opacity="1"/>
      <stop offset="45%" stop-color="#F5C518" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mountain"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%" stop-color="#302419"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600"
        height="420"
        rx="32"
        fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1290"
          cy="210"
          r="155"
          fill="url(#sunGlow)"
          filter="url(#blur)"/>

  <!-- Sun -->
  <circle cx="1290"
          cy="220"
          r="55"
          fill="#FFD84D"/>

  <!-- Far landscape -->
  <path
    d="M0 285
       C140 248 225 268 340 235
       C470 198 560 258 690 225
       C820 193 930 245 1050 218
       C1175 190 1310 235 1440 210
       C1510 198 1560 205 1600 195
       V420 H0 Z"
    fill="#322618"
    fill-opacity=".80"
  />

  <!-- Front hills -->
  <path
    d="M0 330
       C190 290 300 315 430 278
       C560 242 710 304 850 276
       C1000 246 1150 302 1285 270
       C1420 240 1520 280 1600 258
       V420 H0 Z"
    fill="url(#mountain)"
  />

  <!-- Ground -->
  <path
    d="M0 365
       C230 342 410 370 620 348
       C830 326 1005 374 1200 346
       C1380 320 1510 350 1600 340
       V420 H0 Z"
    fill="#090909"
  />

  <!-- Acacia tree -->
  <g transform="translate(1135 85)"
     fill="#080808">

    <!-- trunk -->
    <path
      d="M118 125
         C106 168 111 220 88 295
         H132
         C126 225 138 170 130 125
         Z"
    />

    <!-- branches -->
    <path d="M120 142 L65 92 L74 82 L130 126 Z"/>
    <path d="M126 145 L178 95 L187 105 L132 156 Z"/>
    <path d="M116 160 L43 122 L51 111 L124 145 Z"/>
    <path d="M131 160 L205 128 L210 140 L136 174 Z"/>

    <!-- canopy -->
    <ellipse cx="120" cy="76" rx="145" ry="35"/>
    <ellipse cx="35" cy="96" rx="86" ry="28"/>
    <ellipse cx="205" cy="94" rx="90" ry="29"/>
    <ellipse cx="90" cy="54" rx="90" ry="27"/>
    <ellipse cx="160" cy="56" rx="90" ry="27"/>
  </g>

  <!-- Foreground grass -->
  <g stroke="#080808"
     stroke-width="3">

    <path d="M930 420 L945 350"/>
    <path d="M955 420 L960 362"/>
    <path d="M985 420 L978 350"/>
    <path d="M1020 420 L1030 345"/>
    <path d="M1070 420 L1065 360"/>

    <path d="M1450 420 L1445 347"/>
    <path d="M1490 420 L1500 360"/>
    <path d="M1535 420 L1528 345"/>
  </g>

  <!-- Decorative gold line -->
  <path
    d="M0 95
       C280 10 520 160 820 82
       C1090 10 1330 88 1600 22"
    stroke="#F5C518"
    stroke-width="2"
    stroke-opacity=".15"
  />

</svg>